[project]
name = "crake"
version = "0.1.0"
description = "Plasmid design workbench with curated parts and lab-ready export"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "biopython>=1.86",
    "dna-features-viewer>=3.1.2",
    "dnachisel>=3.2.16",
    "pandas>=2.3.3",
    "primer3-py>=2.3.0",
    "pydna>=5.5.3",
    "snapgene-reader>=0.1.23",
    "streamlit>=1.55.0",
    "streamlit-seqviz>=0.0.5",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
omit = ["src/ui/*"]

[tool.coverage.report]
omit = ["src/ui/*"]

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
]
