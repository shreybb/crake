[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true

[project]
name = "crake"
version = "0.2.0"
description = "Deterministic plasmid design workbench with curated parts and lab-ready export"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Shrey Bhandare", email = "103163688+shreybb@users.noreply.github.com" },
]
keywords = ["bioinformatics", "plasmid", "synthetic-biology", "streamlit", "cloning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "jsonschema>=4.23.0",
    "typer>=0.15.0",
    "biopython>=1.86",
    "dna-features-viewer>=3.1.2",
    "dnachisel>=3.2.16",
    "pandas>=2.3.3",
    "primer3-py>=2.3.0",
    "pydna>=5.5.3",
    "python-dotenv>=1.0.0",
    "snapgene-reader>=0.1.23",
    "streamlit>=1.55.0",
    "streamlit-seqviz>=0.0.5",
]

[project.urls]
Homepage = "https://github.com/shreybb/crake"
Repository = "https://github.com/shreybb/crake"
Issues = "https://github.com/shreybb/crake/issues"

[project.scripts]
crake = "src.cli:app"

[project.optional-dependencies]
dev = ["pytest>=9.0.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "network: tests that call NCBI (skipped in CI by default)",
]

[tool.coverage.run]
source = ["src/agent", "src/session"]
omit = ["src/ui/*"]

[tool.coverage.report]
fail_under = 85

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.9.0",
    "jsonschema>=4.23.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402", "I001"]
